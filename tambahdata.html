<html>
    <head>
        <meta charset="UTF-8">
        <title>Tambah Data Mahasiswa</title>
        <style>
            body {
                font-family: Arial, sans-serif;
            }
            .form-container {
                width: 400px;
                margin: 30px auto;
                padding: 25px;
                border: 1px solid #ccc;
                border-radius: 8px;
                background-color: #f9f9f9;
            }
            .form-container h2 {
                text-align: center;
                margin-bottom: 20px;
            }
            .form-group {
                margin-bottom: 15px;
            }
            .form-group label {
                display: block;
                margin-bottom: 5px;
                font-size: 14px;
                font-weight: bold;
            }
            .form-group input {
                width: 100%;
                padding: 8px 10px;
                border: 1px solid #ccc;
                border-radius: 5px;
                font-size: 14px;
                box-sizing: border-box;
            }
            .btn-group {
                text-align: center;
                margin-top: 20px;
            }
            .btn-simpan {
                background-color: #6c757d;
                color: white;
                padding: 7px 20px;
                border: none;
                border-radius: 20px;
                font-size: 13px;
                font-weight: bold;
                cursor: pointer;
                box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            }
            .btn-simpan:hover { background-color: #545b62; }
            .btn-batal {
                background-color: #dc3545;
                color: white;
                padding: 7px 20px;
                border: none;
                border-radius: 20px;
                font-size: 13px;
                font-weight: bold;
                cursor: pointer;
                box-shadow: 0 2px 5px rgba(0,0,0,0.2);
                text-decoration: none;
                margin-left: 10px;
            }
            .btn-batal:hover { background-color: #b02a37; }
        </style>
    </head>
    <body>

        <h1 align="center">DATA MAHASISWA</h1>
        <p align="center">
            <a href="index.html">🏠 Home</a> |
            <a href="profile.html">📖 Tentang Kami</a> |
            <a href="contact.html">📞 Contact</a>
        </p>
        <hr>

        <div class="form-container">
            <h2>Tambah Data Mahasiswa</h2>

            <div class="form-group">
                <label for="nama">Nama</label>
                <input type="text" id="nama" placeholder="Masukkan nama mahasiswa">
            </div>

            <div class="form-group">
                <label for="foto">Foto</label>
                <input type="file" id="foto" name="foto" accept="image/*">
            </div>

            <div class="form-group">
                <label for="uts">Nilai UTS</label>
                <input type="number" id="uts" placeholder="0 - 100" min="0" max="100">
            </div>

            <div class="form-group">
                <label for="uas">Nilai UAS</label>
                <input type="number" id="uas" placeholder="0 - 100" min="0" max="100">
            </div>

            <div class="form-group">
                <label for="tugas">Nilai Tugas</label>
                <input type="number" id="tugas" placeholder="0 - 100" min="0" max="100">
            </div>

            <div class="btn-group">
                <button class="btn-simpan" onclick="simpanData()">💾 Simpan</button>
                <a href="mahasiswa.html" class="btn-batal">✕ Batal</a>
            </div>
        </div>

        <script>
            function simpanData() {
                var nama  = document.getElementById('nama').value;
                var uts   = document.getElementById('uts').value;
                var uas   = document.getElementById('uas').value;
                var tugas = document.getElementById('tugas').value;

                // Validasi
                if (nama == '' || uts == '' || uas == '' || tugas == '') {
                    alert('Semua field harus diisi!');
                    return;
                }

                // Ambil data lama dari localStorage
                var dataMahasiswa = JSON.parse(localStorage.getItem('dataMahasiswa')) || [];

                // Tambah data baru
                dataMahasiswa.push({
                    nama: nama,
                    uts: uts,
                    uas: uas,
                    tugas: tugas
                });

                // Simpan kembali ke localStorage
                localStorage.setItem('dataMahasiswa', JSON.stringify(dataMahasiswa));

                alert('Data berhasil disimpan!');
                window.location.href = 'mahasiswa.html';
            }
        </script>

    </body>
</html>
