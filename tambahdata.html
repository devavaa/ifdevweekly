<html>
    <head>
        <meta charset="UTF-8">
        <title>Tambah Data Mahasiswa</title>
        <link rel="stylesheet" href="asset/css/style.css">
    </head>
    <body>
        <div class="nav-main">
            <a href="index.html">🏠 Home</a>
            <a href="profile.html">📖 Profile</a>
            <a href="contact.html">📞 Contact</a>
            <a href="mahasiswa.html">👨‍🎓 Data Mahasiswa</a>
        </div>

        <div class="container">
            <h1 class="text-center">DATA MAHASISWA</h1>

            <div class="form-container">
                <h2>Tambah Data Mahasiswa</h2>

                <div class="form-group">
                    <label for="nama">Nama</label>
                    <input type="text" id="nama" placeholder="Masukkan nama mahasiswa">
                </div>

                <div class="form-group">
                    <label for="foto">Foto</label>
                    <input type="file" id="foto" name="foto" accept="image/*">
                </div>

                <div class="form-group">
                    <label for="uts">Nilai UTS</label>
                    <input type="number" id="uts" placeholder="0 - 100" min="0" max="100">
                </div>

                <div class="form-group">
                    <label for="uas">Nilai UAS</label>
                    <input type="number" id="uas" placeholder="0 - 100" min="0" max="100">
                </div>

                <div class="form-group">
                    <label for="tugas">Nilai Tugas</label>
                    <input type="number" id="tugas" placeholder="0 - 100" min="0" max="100">
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" onclick="simpanData()">💾 Simpan</button>
                    <a href="mahasiswa.html" class="btn btn-danger">✕ Batal</a>
                </div>
            </div>
        </div>

        <script>
            function simpanData() {
                var nama  = document.getElementById('nama').value;
                var uts   = document.getElementById('uts').value;
                var uas   = document.getElementById('uas').value;
                var tugas = document.getElementById('tugas').value;

                // Validasi
                if (nama == '' || uts == '' || uas == '' || tugas == '') {
                    alert('Semua field harus diisi!');
                    return;
                }

                // Ambil data lama dari localStorage
                var dataMahasiswa = JSON.parse(localStorage.getItem('dataMahasiswa')) || [];

                // Tambah data baru
                dataMahasiswa.push({
                    nama: nama,
                    uts: uts,
                    uas: uas,
                    tugas: tugas
                });

                // Simpan kembali ke localStorage
                localStorage.setItem('dataMahasiswa', JSON.stringify(dataMahasiswa));

                alert('Data berhasil disimpan!');
                window.location.href = 'mahasiswa.html';
            }
        </script>
    </body>
</html>
